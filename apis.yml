name: ACTIVON Co., Ltd.
description: 'ACTIVON Co., Ltd. (엑티브온) is a South Korean green-biotechnology materials
  company founded in 2009 and headquartered in Suwon, Gyeonggi-do, that develops and
  manufactures cosmetic ingredients and micro-encapsulation technology — skin-safe
  preservative alternatives, multifunctional actives, emollients, humectants and bio-converted
  ingredients — alongside functional pigment lines (EnergiON heat-storage, Thermon thermochromic,
  Photon, Fragron, Memorion, MultiON) sold into textiles, coatings, plastics and cosmetics.
  It is a specialty-materials manufacturer, not a software vendor: it publishes no developer
  portal, no API reference and no machine-readable API contract. Its only machine-readable
  agent surface is the Wix-platform site MCP endpoint and llms.txt served on its corporate
  site, both probed live by API Evangelist.'

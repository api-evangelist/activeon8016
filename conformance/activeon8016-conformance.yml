domain_standards:
  checked: true
  found: []
  note: >-
    Cosmetic-ingredient supply has machine-readable domain standards in the trade-data layer
    (INCI naming, CAS numbers, EC numbers, IFRA/RIFM records, SDS/GHS classification), and
    ACTIVON does name INCI/CAS values in its human-readable product pages. None of it is
    published as a machine-readable contract, feed, or catalog endpoint, so nothing is
    asserted here. Reward-only dimension: recorded as absent, not as a failure.
compliance:
  certifications_published: false
  note: >-
    The company's Trust page (https://www.activon-global.com/trust, HTTP 200) carries only
    narrative corporate values — "eco-friendly bio materials which are safe and efficient",
    "sustainable growth based on technical excellence" — and names no certification
    (no ISO 9001/14001/22716, COSMOS, ECOCERT, halal or vegan claim). The Korean site's
